spring:
  security:
    oauth2:
      resource server:
        jwt:
          secret-key: bXktc3VwZXItc2VjcmV0LWtleS0zMmJ5dGVzLWxvbmc=
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/payment_db?serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # or create-drop for first-time dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8085