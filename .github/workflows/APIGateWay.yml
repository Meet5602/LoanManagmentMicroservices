name: API Gateway CI

on:
  push:
    paths:
      - "api-gateway/**"
      - "common-contracts/**"
      - "pom.xml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build API Gateway
        run: mvn clean verify -pl api-gateway -am