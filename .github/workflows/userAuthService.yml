name: User Auth Service CI

on:
  push:
    paths:
      - "user-auth-service/**"
      - "common-contracts/**"
      - "pom.xml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build User Auth Service
        run: mvn clean verify -pl user-auth-service -am